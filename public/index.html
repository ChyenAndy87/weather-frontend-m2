<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS compilado de SASS -->
  <link rel="stylesheet" href="assets/css/style.css">

  <title>ClimaApp</title>
</head>

<body class="weather-app">

  <!-- Navbar -->
  <header class="weather-app__header">
    <nav class="navbar navbar-expand-lg bg-primary-subtle">
      <div class="container">
        <a class="navbar-brand weather-app__brand" href="#">ClimaApp</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div id="navbarNav" class="collapse navbar-collapse">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a id="nav-home" class="nav-link weather-app__nav-link active" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a id="nav-detalle" class="nav-link weather-app__nav-link" href="#">Detalle</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="weather-app__content">

    <!-- Home -->
    <section id="home-section" class="weather-app__home">
      <h1 class="weather-app__title">Clima en las ciudades del mundo</h1>

      <div class="container">
        <div id="ciudades-row" class="row g-3">
          <!-- Cards insertadas por JS -->
        </div>
      </div>
    </section>

    <!-- Detalle -->
    <section id="detalle-section" class="weather-app__detalle d-none">
      <div class="container mt-4">
        <button id="back-home" class="btn btn-primary mb-3">← Volver</button>

        <h2 id="detalle-ciudad" class="weather-app__detalle-title"></h2>

        <div id="pronostico-row" class="row g-3"></div>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="weather-app__footer text-center mt-4">
    <p>© 2025 ClimaApp</p>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="assets/js/main.js"></script>

</body>
</html>
